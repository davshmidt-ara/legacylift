# Applies the database migrations and deploys the AI function to Supabase. Run it by hand:
# GitHub → Actions → "Supabase backend" → Run workflow.
#
# One-time setup (see docs/DEPLOYMENT.md):
#   Repository variable  SUPABASE_PROJECT_REF    e.g. xfqlcjdywkfvrkipbunr
#   Repository secrets   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com → Account → Access tokens
#                        SUPABASE_DB_PASSWORD    the project's database password
#                        ANTHROPIC_API_KEY       (optional) enables the AI features
#   Repository variable  AI_ALLOWED_ORIGINS      (optional) e.g. https://legacylift.lv,https://www.legacylift.lv
name: Supabase backend

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply database migrations
        type: boolean
        default: true
      deploy_function:
        description: Deploy the business-ai function
        type: boolean
        default: true

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check settings
        run: |
          test -n "$PROJECT_REF" || { echo "::error::Set the SUPABASE_PROJECT_REF repository variable"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Set the SUPABASE_ACCESS_TOKEN secret"; exit 1; }
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        if: inputs.migrate
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Set AI secrets
        if: inputs.deploy_function
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_ALLOWED_ORIGINS: ${{ vars.AI_ALLOWED_ORIGINS }}
        run: |
          args=()
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$AI_ALLOWED_ORIGINS" ] && args+=("AI_ALLOWED_ORIGINS=$AI_ALLOWED_ORIGINS")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; else echo "No AI secrets provided; the app keeps using demo mode for AI."; fi
      - name: Deploy business-ai function
        if: inputs.deploy_function
        run: supabase functions deploy business-ai --project-ref "$PROJECT_REF"
