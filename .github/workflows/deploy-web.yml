# Tests every change, and publishes the website to Firebase Hosting (Google) from main.
#
# One-time setup (see docs/DEPLOYMENT.md):
#   Repository variable  FIREBASE_PROJECT_ID       e.g. legacylift-prod
#   Repository secret    FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with the "Firebase Hosting Admin" role
# Until FIREBASE_PROJECT_ID is set, only the checks run.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Publish to Firebase Hosting
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
